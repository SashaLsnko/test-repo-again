version: "2.1"

parameters:
  suffix:
    type: string
    default: release

jobs:
  build:
    parameters:
      word:
        type: string
    machine: true
    steps:
      - run: test << parameters.word >> world
  deploy:
    machine: true
    steps:
      - run: "foo"

workflows:
  workflow:
    jobs:
      - build:
          matrix:
            parameters:
              word: ["a"]
            alias: "pkg-<< pipeline.parameters.suffix >>"
      - deploy:
          requires: ["pkg-release"]
