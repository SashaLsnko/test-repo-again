version: "2.1"
parameters:
  flag:
    type: boolean
    default: true
jobs:
  runner:
    parameters:
      custom-steps:
        type: steps
        default: []
    machine: true
    steps:
      - checkout
      - steps: << parameters.custom-steps >>

workflows:
  main:
    jobs:
      - runner:
          custom-steps:
            - when:
                condition:
                  equal: << pipeline.parameters.flag >>
                steps:
                  - run: echo "test"
