version: 2.1

setup: true

orbs:
  continuation: circleci/continuation@1

jobs:
  setup_job:
    docker:
      - image: cimg/base:stable
    steps:
      - checkout
      - run:
          name: Echo setup message
          command: |
            echo "Running setup config..."
            echo "Will continue to real_config.yml"
      - continuation/continue:
          configuration_path: .circleci/real_config.yml

workflows:
  setup_workflow:
    jobs:
      - setup_job
