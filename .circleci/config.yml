version: 2.1

jobs:
  noop:
    docker:
      - image: cimg/base:current
    steps:
      - run: echo "ran"

workflows:
  # Control: always true on a branch push, so you know the config compiled.
  control-branch-nonempty:
    when: pipeline.git.branch matches /.+/
    jobs: [noop]

  # 1. The fallback case from your report.
  tag-or-none:
    when: (pipeline.git.tag or "none") == "none"
    jobs: [noop]

  # 2. Equality with the empty string.
  tag-equals-empty:
    when: pipeline.git.tag == ""
    jobs: [noop]

  # 3. Truthiness of the bare value.
  tag-truthy:
    when: pipeline.git.tag
    jobs: [noop]

  # 4. Negated truthiness.
  tag-not:
    when: not pipeline.git.tag
    jobs: [noop]

  # 5. Not-equal to empty string.
  tag-not-equals-empty:
    when: pipeline.git.tag != ""
    jobs: [noop]
